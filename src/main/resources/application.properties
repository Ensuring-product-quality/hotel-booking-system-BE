# Server port configuration (Railway / Cloud uses $PORT)
server.port=${PORT:8080}

# Database settings: Supports Railway env vars (SPRING_DATASOURCE_URL, DATABASE_URL, MYSQL_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:hotelnow;DB_CLOSE_DELAY=-1}}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${POSTGRES_USER:sa}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${POSTGRES_PASSWORD:}}}
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}

# HikariCP settings to prevent rapid reconnect log floods
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Hibernate configuration (Disabled SQL logging in production to avoid log rate limits)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=false

# Logging levels (Prevent 500 logs/sec flood on Railway)
logging.level.root=INFO
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate=WARN
logging.level.com.hotelnow.backend=INFO

# Security JWT configuration
jwt.secret=9a4f2c8d3b7a1e6f5c8d9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d
jwt.expiration=900000
jwt.refreshExpiration=604800000

# Base URL for static assets (overridden in production by env var APP_BASE_URL)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Trust forwarded headers from reverse proxy
server.forward-headers-strategy=framework

# Optional one-time admin bootstrap
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

server.port=8080

# Database settings: Configured with environment variable placeholders (defaults to H2 for safe git pushes)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hotelnow;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}


# Hibernate configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Security JWT configuration
jwt.secret=9a4f2c8d3b7a1e6f5c8d9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d
jwt.expiration=900000
jwt.refreshExpiration=604800000

# Base URL for static assets (overridden in production by env var APP_BASE_URL)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Trust forwarded headers from reverse proxy (e.g. Nginx proxying https://www.hotelnow.com/vi-vn/api to local)
server.forward-headers-strategy=framework

# Optional one-time admin bootstrap. Keep disabled unless all values come from secure environment variables.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

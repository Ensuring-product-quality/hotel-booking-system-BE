server.port=8080
server.servlet.context-path=/api

# Database settings: Default to H2 in-memory database for local execution out-of-the-box
spring.datasource.url=jdbc:h2:mem:hotelnow;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL configuration (commented out, can be enabled when MySQL is running)
# spring.datasource.url=jdbc:mysql://localhost:3306/hotelnow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security JWT configuration
jwt.secret=9a4f2c8d3b7a1e6f5c8d9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d
jwt.expiration=900000
jwt.refreshExpiration=604800000

# Base URL for static assets (overridden in production by env var APP_BASE_URL)
app.base-url=http://localhost:8080/api

# Trust forwarded headers from reverse proxy (e.g. Nginx proxying https://www.hotelnow.com/vi-vn/api to local)
server.forward-headers-strategy=framework
